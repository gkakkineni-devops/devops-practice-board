name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tickets, board and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check every ticket and that board.json is current
        run: python scripts/build_board.py --check

      - name: Test the board script
        run: python -m unittest discover -s tests

      - name: Lint
        run: |
          pip install ruff
          ruff check .
          ruff format --check .
